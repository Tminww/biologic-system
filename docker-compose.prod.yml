services:
  biologic-db:
    container_name: biologic-db
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: biologic
      POSTGRES_PASSWORD: biologic
      POSTGRES_DB: biologic
    volumes:
      - biologic-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U biologic -d biologic",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  biologic-migrations:
    container_name: biologic-migrations
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    image: ghcr.io/tminww/biologic-prod-api:latest

    depends_on:
      biologic-db:
        condition: service_healthy
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://biologic:biologic@biologic-db:5432/biologic
      APP_ALEMBIC_DATABASE_URL: postgresql+asyncpg://biologic:biologic@biologic-db:5432/biologic
    command: ["alembic", "upgrade", "head"]

  biologic-api:
    container_name: biologic-api
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    image: ghcr.io/tminww/biologic-prod-api:latest

    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://biologic:biologic@biologic-db:5432/biologic
      APP_ALEMBIC_DATABASE_URL: postgresql+asyncpg://biologic:biologic@biologic-db:5432/biologic
    depends_on:
      biologic-db:
        condition: service_healthy
      biologic-migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health')",
        ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  biologic-frontend:
    container_name: biologic-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    image: ghcr.io/tminww/biologic-prod-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_MODE: "${VITE_API_MODE:-live}"
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-https://api.bio.tminww.space}"
      VITE_API_PREFIX: "${VITE_API_PREFIX:-/api/v1}"
      VITE_API_REQUEST_CASE: "${VITE_API_REQUEST_CASE:-snake}"
      VITE_API_SUPPORTS_FILTERS: "${VITE_API_SUPPORTS_FILTERS:-false}"
      VITE_AUTH_MODE: "${VITE_AUTH_MODE:-mock}"

    depends_on:
      biologic-api:
        condition: service_healthy

  biologic-docs:
    container_name: biologic-docs
    build:
      context: ./docs-site
      dockerfile: Dockerfile
      target: prod
    image: ghcr.io/tminww/biologic-prod-docs:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  biologic-db-data:
