map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream biologic_api {
    server 127.0.0.1:8080;
}

upstream biologic_app {
    server 127.0.0.1:5173;
}

upstream biologic_docs {
    server 127.0.0.1:3000;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name api.bio.tminww.space bio.tminww.space docs.bio.tminww.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# API
server {
    listen 443 ssl;
    http2 on;
    server_name api.bio.tminww.space;

    ssl_certificate     /etc/letsencrypt/live/tminww.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tminww.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers off;
    client_max_body_size 20m;

    location / {
        proxy_pass http://biologic_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

